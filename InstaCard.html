<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insta Card</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Satisfy&display=swap"
      rel="stylesheet"
    />
  </head>
  <style>
    * {
      margin: 0%;
      padding: 0%;
      box-sizing: border-box;
    }
    img {
      height: 100vh;
      width: 100%;
      filter: blur(8px);
    }
    #card {
      width: 23%;
      height: 80%;
      z-index: 100;
      position: absolute;
      left: 40%;
      top: 50px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
    }
    span {
      position: absolute;
      left: 30%;
      top: 20px;
    }
    #cam {
      position: absolute;
      top: 20px;
      left: 20px;
    }

    #send {
      position: absolute;
      left: 80%;
      top: 30px;
    }

    #Profile {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(
        125deg,
        yellow,
        red,
        rgb(228, 115, 134),
        rgb(203, 69, 161)
      );
      position: absolute;
      top: 120px;
      left: 47%;
      z-index: 200;
    }

    #Profile > img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      filter: none;
      border: 2px solid white;
    }
    h2 {
      font-family: "Arial", sans-serif;
      text-wrap: nowrap;
      margin-top: 15px;
      margin-left: -10px;
    }
    p {
      margin-left: -27px;
    }
    .name {
      margin-left: -10px;
      text-wrap: nowrap;
      font-weight: bold;
      font-family: "Arial", sans-serif;
      margin-top: 5%;
    }
    button {
      color: white;
      background-color: rgb(10, 113, 209);
      padding: 5px 20px;
      border-radius: 5px;
      border: none;
      margin-top: 20%;
      margin-left: 15%;
    }
    #detail {
      margin-top: 15%;
    }
    #detail > p {
      border-top: 2px solid gray;
      width: 293%;
      text-wrap: nowrap;
      margin-left: -93%;
      padding: 6px;
      color: rgb(59, 150, 235);
      text-align: center;
    }
    #contact {
      display: flex;
      gap: 35px;
      width: 300px;
      margin-top: 7%;
      margin-left: -80%;
    }
    #hand > img {
      position: absolute;
      filter: none;
      width: 545%;
      height: 310%;
      margin-top: -200%;
      margin-left: -250%;
      z-index: -1000;
      filter: none;
    }
  </style>
  <body>
    <div>
      <img
        src="https://tse2.mm.bing.net/th/id/OIP.6CtIeRz_Qcw5wlvAFSLlUwHaE8?r=0&cb=thfc1falcon2&pid=ImgDet&w=474&h=316&rs=1&o=7&rm=3"
      />
      <div id="card">
        <svg
          id="cam"

          xmlns="http://www.w3.org/2000/svg"
          width="28"
          height="28"

          viewBox="0 0 16 16"
        >
          <path d="M10.5 8.5a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0" />
          <path
            d="M2 4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1.172a2 2 0 0 1-1.414-.586l-.828-.828A2 2 0 0 0 9.172 2H6.828a2 2 0 0 0-1.414.586l-.828.828A2 2 0 0 1 3.172 4zm.5 2a.5.5 0 1 1 0-1 .5.5 0 0 1 0 1m9 2.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0"
          />

      <div id="Profile">
        <img src="./WhatsApp Image 2026-06-12 at 4.17.34 PM (1).jpeg" />
        <h2>Muskan Soni</h2>

        <p class="name">
          Fronted Developer<br />
          Feel free to contact me!
        </p>
        <button>Follow</button>
        <div id="detail">
          <p>📞 +9956140067</p>
          <p>✉️ sonimuskan9415@gmail.com</p>
          <p>🌍 www.inflection.org</p>
          <p></p>
        </div>
        <div id="contact">

            />
          </svg>
        </div>
        <div id="hand">
          <img src="./m.png" />
        </div>
      </div>
    </div>
  </body>
</html>
